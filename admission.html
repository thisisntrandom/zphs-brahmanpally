<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission - ZPHS Brahmanpally</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            ZPHS Brahmanpally
        </a>
    </div>
</nav>

<div class="container my-5">

<div class="card shadow">

<div class="card-header bg-success text-white">
<h2>New Student Admission Form</h2>
</div>

<div class="card-body">

<form id="admissionForm">
<h4 class="text-primary">Admission Details</h4>

<div class="row">

<div class="col-md-6 mb-3">
<label>Admission ID</label>
<input type="text" class="form-control"
name="admissionID"
placeholder="To be allotted by HM"
readonly>
</div>

<div class="col-md-6 mb-3">
<label>Admission Date</label>
<input type="date"
class="form-control"
name="admissionDate"
id="admissionDate"
readonly>
</div>

</div>

<hr>
<h4 class="text-primary">Student Details</h4>

<div class="row">

<div class="col-md-6 mb-3">
<label>Student Full Name</label>
<input type="text" class="form-control" name="studentName" required>
</div>

<div class="col-md-6 mb-3">
<label>Class Seeking Admission</label>
<select class="form-select" name="class" required>
<option value="">Select</option>
<option>6th</option>
<option>7th</option>
<option>8th</option>
<option>9th</option>
<option>10th</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Medium</label>

<select class="form-select" name="medium">

<option>Telugu</option>

<option>English</option>

</select>

</div>

<div class="col-md-4 mb-3">
<label>Date of Birth</label>
<input type="date" class="form-control" name="dob" required>
</div>

<div class="col-md-4 mb-3">
<label>Gender</label>
<select class="form-select" name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Blood Group</label>
<select class="form-select" name="blood">

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>
</div>

<div class="col-md-6 mb-3">
<label>Aadhaar Number</label>
<input type="text" maxlength="12" class="form-control" name="aadhaar">
</div>

<div class="col-md-4 mb-3">
<label>Mother Tongue</label>
<input type="text" class="form-control" name="motherTongue">
</div>

<div class="col-md-4 mb-3">
<label>Religion</label>
<input type="text" class="form-control" name="religion">
</div>

<div class="col-md-4 mb-3">
<label>Caste</label>
<input type="text" class="form-control" name="caste">
</div>

<div class="col-md-4 mb-3">
<label>Category</label>

<select class="form-select" name="category">

<option>OC</option>
<option>BC-A</option>
<option>BC-B</option>
<option>BC-C</option>
<option>BC-D</option>
<option>BC-E</option>
<option>SC</option>
<option>ST</option>

</select>

</div>

<div class="col-md-6 mb-3">
<label>Identification Mark 1</label>
<input type="text" class="form-control" name="mole1">
</div>

<div class="col-md-6 mb-3">
<label>Identification Mark 2</label>
<input type="text" class="form-control" name="mole2">
</div>

</div>

<hr>

<h4 class="text-primary">Parent Details</h4>

<div class="row">

<div class="col-md-4 mb-3">
<label>Father Name</label>
<input type="text" class="form-control" name="father" required>
</div>

<div class="col-md-4 mb-3">
<label>Father Occupation</label>
<input type="text" class="form-control" name="fatherOccupation">
</div>

<div class="col-md-4 mb-3">
<label>Father Mobile Number</label>
<input type="tel" class="form-control" name="fatherMobile" maxlength="10" required>
</div>

<div class="col-md-4 mb-3">
<label>Mother Name</label>
<input type="text" class="form-control" name="mother">
</div>

<div class="col-md-4 mb-3">
<label>Mother Occupation</label>
<input type="text" class="form-control" name="motherOccupation">
</div>

<div class="col-md-4 mb-3">
<label>Mother Mobile Number</label>
<input type="tel" class="form-control" name="motherMobile" maxlength="10">
</div>

</div>

<h4 class="text-primary">Previous School Details</h4>

<div class="row">

<div class="col-md-6 mb-3">
<label>Previous School Name</label>
<input type="text" class="form-control" name="previousSchool">
</div>

<div class="col-md-6 mb-3">
<label>Medium of Instruction</label>
<select class="form-select" name="previousMedium">
<option>Telugu</option>
<option>English</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>TC Number</label>
<input type="text" class="form-control" name="tcNumber">
</div>

<div class="col-md-6 mb-3">
<label>TC Date</label>
<input type="date" class="form-control" name="tcDate">
</div>

</div>

<div class="mt-4">

<button class="btn btn-success btn-lg" type="submit">
Submit Admission
</button>

<button class="btn btn-secondary btn-lg" type="reset">
Reset
</button>

</div>

</form>

</div>

</div>

</div>

<script src="admission.js"></script>

</body>
</html>
